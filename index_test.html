<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthCore Test Panel</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        background: #f5f7fb;
        color: #1f2937;
      }
      .panel {
        max-width: 1100px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin: 20px 0;
      }
      button {
        border: none;
        background: #2563eb;
        color: white;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.9rem;
      }
      input {
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
      }
      pre {
        background: #111827;
        color: #d1fae5;
        padding: 16px;
        border-radius: 8px;
        overflow: auto;
        min-height: 240px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      a {
        color: #1d4ed8;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <h1>HealthCore – Panel de pruebas</h1>
        <a href="./index.html">← Volver al sitio principal</a>
      </div>

      <div class="controls">
        <button data-action="filterClaims">Filtrar reclamos</button>
        <button data-action="filterAppointments">Filtrar citas</button>
        <button data-action="sortClaims">Ordenar reclamos</button>
        <button data-action="sortAppointments">Ordenar citas</button>
        <button data-action="groupClaims">Agrupar reclamos</button>
        <button data-action="search">Buscar reclamos y clínicos</button>
        <button data-action="binarySearch">Búsqueda binaria</button>
        <button data-action="denialRate">Tasa de denegación</button>
        <button data-action="noShow">Métricas de no-show</button>
        <button data-action="cme">Reportes CME</button>
        <button data-action="validate">Validaciones</button>
        <button data-action="thresholds">Umbrales</button>
      </div>

      <div class="controls">
        <label>
          Umbral
          <input id="threshold" type="number" value="8" />
        </label>
        <label>
          Fecha de cierre de semana
          <input id="weekEndingDate" type="date" />
        </label>
        <label>
          Fecha de referencia
          <input id="asOfDate" type="date" />
        </label>
      </div>

      <pre id="output">Pulsa un botón para ejecutar las comprobaciones del dominio de HealthCore.</pre>
    </div>

    <script type="module" src="./dist/index_test.js"></script>
  </body>
</html>
