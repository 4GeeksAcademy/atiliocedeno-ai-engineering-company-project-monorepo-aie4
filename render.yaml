services:
  - type: web
    name: healthcore-api
    runtime: python
    rootDir: services/healthcore-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: HEALTHCORE_JWT_SECRET
        generateValue: true
      - key: HEALTHCORE_FRONTEND_URL
        value: https://healthcore-backoffice.onrender.com
      - key: HEALTHCORE_DB_PATH
        value: /var/data/healthcore.json
    disk:
      name: healthcore-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: healthcore-backoffice
    runtime: static
    rootDir: uis/backoffice
    buildCommand: ""
    staticPublishPath: .
