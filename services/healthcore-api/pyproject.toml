[project]
name = "healthcore-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2,<3",
    "pydantic>=2.9,<3",
    "tinydb>=4.8,<5",
]

[project.scripts]
seed = "seed:main"

[tool.setuptools]
py-modules = ["seed"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
