[project]
name = "healthcore-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "email-validator>=2.2,<3.0",
    "tinydb>=4.8,<5.0",
    "passlib>=1.9.5,<2.0",
    "bcrypt>=5.0,<6.0",
    "PyJWT>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "phonenumbers>=9.0,<10",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[project.scripts]
seed = "seed:main"

[tool.setuptools]
py-modules = ["seed"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
